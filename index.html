<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valeria XV - Invitación</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Pantalla de Bienvenida / Overlay -->
    <div id="welcome-screen">
        <button id="open-btn">Abrir Invitación ✨</button>
    </div>

    <!-- Etiqueta de audio oculta -->
    <audio id="musica-fondo" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <!-- Efecto de Estrellas -->
    <div id="stars"></div>

    <main class="container">
        <section class="photo-section">
            <img src="image_950627.png" alt="Valeria" class="main-photo">
        </section>

        <section class="info-section">
            <h1 class="title">Valeria XV</h1>
            <div class="countdown" id="timer">Cargando cuenta regresiva...</div>
            
            <div class="content">
                <p class="intro">Y como queremos que disfrutes al máximo este día te mando algunas recomendaciones:</p>
                <ul class="recommendations">
                    <li>✨ Recuerda llevar algo para abrigarte</li>
                    <li>💃 Zapatos cómodos para bailar</li>
                    <li>😊 ¡Traer tu mejor sonrisa y actitud para divertirnos!</li>
                </ul>
            </div>

            <div class="venue">
                <p><strong>Misa:</strong> Samara</p>
                <p><strong>Recepción:</strong> G&G</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
